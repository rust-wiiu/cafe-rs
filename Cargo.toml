[package]
name = "cafe-rs"
version = "0.1.0"
authors = ["29th-Day"]
edition = "2024"
license-file = "LICENSE"
keywords = ["wiiu", "homebrew"]
description = "Wii U SDK"
repository = "https://github.com/rust-wiiu/cafe-rs"

[lib]
test = false
bench = false

[features]
default = ["rt", "panic", "alloc"]
rt = ["dep:cafe-rt"]
panic = ["cafe-rt?/panic"]
alloc = ["cafe-rt?/alloc"]

[dependencies]
bitflags = "2.13.0"
bon = { version = "3.9.3", default-features = false }
cafe-rt = { path = "../cafe-rt", optional = true }
cafe-sys = { path = "../cafe-sys" }
gfx2 = "0.4.1"
log = "0.4.33"
num_enum = { version = "0.7.6", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
